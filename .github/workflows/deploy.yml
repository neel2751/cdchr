name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cdc_neel
          aws-region: eu-west-2

      - name: Deploy via AWS SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /home/ubuntu/cdchr || exit 1",
              "git reset --hard",
              "git clean -fd -e .env",
              "git pull origin main",
              "rm -rf node_modules .next",
              "npm install",
              "npm run build",
              "pm2 restart next-app || pm2 start npm --name next-app -- start",
              "pm2 save"
            ]' \
            --comment "Deploy from GitHub Actions"
